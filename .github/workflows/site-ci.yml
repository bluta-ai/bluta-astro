name: Website CI

on:
  pull_request:
  push:
    branches:
      - main
      - redesign/blutech-website-v1

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build and run 36-category audit
        run: npm run check
