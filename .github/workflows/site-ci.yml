name: Website CI

on:
  pull_request:
  push:
    branches:
      - main
      - redesign/blutech-website-v1

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and run 36-category audit
        run: npm run check
